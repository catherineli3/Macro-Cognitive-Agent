[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-research-agent"
version = "3.0.0"
description = "Macro Cognitive Agent — Automated Macroeconomic Research with 10-Engine Closed Loop"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "langgraph>=0.0.55,<1.0.0",
    "langchain>=0.2.0,<1.0.0",
    "langchain-core>=0.2.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pandas>=2.2.0,<3.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "pyyaml>=6.0,<7.0",
    "asyncpg>=0.29.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "yfinance>=0.2.40,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "black>=24.4.0,<25.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "types-PyYAML>=6.0.0,<7.0.0",
    "pre-commit>=3.7.0,<4.0.0",
]

[project.scripts]
macro-agent = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "tests*"]

[tool.setuptools.package-dir]
"src" = "src"
"tests" = "tests"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line length is enforced by the formatter (black); remaining
              # long lines are LLM prompts / log strings that must not be split
    "UP042",  # keep `str, Enum` mixin: StrEnum changes f-string rendering of
              # members, which would alter LLM prompt content
    "N801",   # KPI1_*/KPI2_* class names are intentional domain naming
    "N806",   # uppercase pseudo-constants inside functions are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]       # conftest/test modules adjust sys.path before imports
"**/__init__.py" = ["F401"] # package re-exports

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true

# ── Gradual typing adoption ──────────────────────────────────────────────
# The packages below predate mypy adoption and are exempted until they are
# annotated (tracked as tech debt — shrink this list over time).
# All other modules are type-checked on every CI run.
[[tool.mypy.overrides]]
module = [
    "src.agent", "src.agent.*",
    "src.belief_versioning", "src.belief_versioning.*",
    "src.calibration", "src.calibration.*",
    "src.capital_flow", "src.capital_flow.*",
    "src.collector", "src.collector.*",
    "src.data_pipeline", "src.data_pipeline.*",
    "src.diagnosis", "src.diagnosis.*",
    "src.executor", "src.executor.*",
    "src.learning", "src.learning.*",
    "src.live_intelligence", "src.live_intelligence.*",
    "src.llm", "src.llm.*",
    "src.memory", "src.memory.*",
    "src.news", "src.news.*",
    "src.normalizer", "src.normalizer.*",
    "src.pipeline",
    "src.regime", "src.regime.*",
    "src.renderer", "src.renderer.*",
    "src.research", "src.research.*",
    "src.research_cycle", "src.research_cycle.*",
    "src.summary_engine", "src.summary_engine.*",
    "src.transmission", "src.transmission.*",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--ignore=tests/integration -m \"not external_api and not slow\""
markers = [
    "external_api: tests that depend on live external APIs (may be skipped when offline)",
    "slow: long-running stress tests (run on demand with -m slow)",
]
